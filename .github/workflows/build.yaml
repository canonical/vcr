name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  pack:
    name: Build & Package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup LXD
        uses: canonical/setup-lxd@v1
        with:
          channel: 5.21/stable

      - name: Build snap
        run: |
          sudo snap install snapcraft --classic --channel=latest/stable
          snapcraft pack --use-lxd

      - name: Upload snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-course-recorder-snap
          path: video-course-recorder_*.snap
          retention-days: 30

      - name: Install & smoke test
        env:
          CONTENT_REPO_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
        run: |
          SNAP_FILE=$(ls video-course-recorder_*.snap | head -1)
          sudo snap install "./$SNAP_FILE" --dangerous
          ./snap/test-smoke.sh

      - name: Upload VCR logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vcr-logs
          path: /tmp/vcr-*.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Summary
        run: |
          SNAP_FILE=$(ls video-course-recorder_*.snap | head -1)
          echo "### Build Summary :package:" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Snap:** $SNAP_FILE" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Size:** $(du -h "$SNAP_FILE" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
