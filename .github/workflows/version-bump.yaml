name: Version Bump

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver bump level'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  bump:
    name: Bump version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute new version
        id: ver
        run: |
          CUR=$(grep '"version"' package.json | head -1 | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          IFS='.' read -r MA MI PA <<< "$CUR"
          case "${{ inputs.bump }}" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            patch) PA=$((PA+1)) ;;
          esac
          NEW="${MA}.${MI}.${PA}"
          echo "cur=$CUR" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "Bump $CUR -> $NEW"

      - name: Guard - tag must not exist
        run: |
          if git rev-parse "v${{ steps.ver.outputs.new }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.ver.outputs.new }} already exists"; exit 1
          fi

      - name: Write version files
        run: |
          NEW="${{ steps.ver.outputs.new }}"
          sed -i -E "s/(\"version\": *\")[^\"]+(\")/\1${NEW}\2/" package.json
          sed -i -E "s/^version:.*/version: '${NEW}'/" snap/snapcraft.yaml
          echo "package.json:"; grep '"version"' package.json | head -1
          echo "snapcraft.yaml:"; grep '^version:' snap/snapcraft.yaml

      - name: Commit, tag, push
        run: |
          NEW="${{ steps.ver.outputs.new }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json snap/snapcraft.yaml
          git commit -m "Bump version to v${NEW}"
          git tag -a "v${NEW}" -m "Release v${NEW}"
          git push origin HEAD
          git push origin "v${NEW}"

      - name: Summary
        run: |
          echo "### Version bumped :arrow_up:" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${{ steps.ver.outputs.cur }} -> **${{ steps.ver.outputs.new }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: v${{ steps.ver.outputs.new }}" >> "$GITHUB_STEP_SUMMARY"
