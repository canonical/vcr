name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Snap channel to release to'
        required: true
        type: choice
        default: 'edge'
        options:
          - edge
          - beta
          - candidate
          - stable
      grade:
        description: 'Snap grade'
        required: true
        type: choice
        default: 'devel'
        options:
          - devel
          - stable
      create_tag:
        description: 'Create and push a git tag (v<version>)'
        type: boolean
        default: true

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read snap version
        id: version
        run: |
          VER=$(grep '^version:' snap/snapcraft.yaml | awk '{print $2}' | tr -d "'\"")
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Snap version: ${VER}"

      - name: Setup LXD
        uses: canonical/setup-lxd@v1
        with:
          channel: 5.21/stable

      - name: Build snap
        env:
          GRADE: ${{ inputs.grade }}
        run: |
          sudo snap install snapcraft --classic --channel=latest/stable
          # Set grade for this build only
          sed -i "s/^grade:.*/grade: ${GRADE}/" snap/snapcraft.yaml
          snapcraft pack --use-lxd

      - name: Upload to Snap Store
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          echo "${SNAPCRAFT_STORE_CREDENTIALS}" | snapcraft login --with -
          SNAP_FILE=$(ls vcr_*.snap | head -1)
          snapcraft upload "$SNAP_FILE" --release=${{ inputs.channel }}

      - name: Create git tag
        if: ${{ inputs.create_tag }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git tag -a "${TAG}" -m "Release ${TAG} to ${{ inputs.channel }}"
          git push origin "${TAG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.version }}"
          tag_name: "v${{ steps.version.outputs.version }}"
          files: vcr_*.snap
          generate_release_notes: true
          draft: ${{ inputs.channel != 'stable' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "### Released :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** v${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Channel:** ${{ inputs.channel }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Grade:** ${{ inputs.grade }}" >> "$GITHUB_STEP_SUMMARY"
