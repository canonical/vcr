name: Test

on:
  push:
    branches-ignore:
      - main
  pull_request:

jobs:
  verify:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup LXD
        uses: canonical/setup-lxd@v1
        with:
          channel: 5.21/stable

      - name: Install spread
        run: |
          sudo snap install spread
      - name: Run spread tests
        run: |
          spread 
