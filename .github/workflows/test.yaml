name: Test

on:
  push:
    branches-ignore:
      - main
  pull_request:

jobs:
  verify:
    name: Build Verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup LXD
        run: |
          sudo snap install lxd --channel=5.21/stable
          sudo lxd init --auto
          sudo adduser "$USER" lxd
          sudo lxd waitready --timeout=60

      - name: Install spread
        run: |
          sudo snap install go --classic
          go install github.com/canonical/spread/cmd/spread@latest
          sudo cp ~/go/bin/spread /usr/local/bin/

      - name: Run spread tests
        run: |
          sudo snap install snapcraft --classic --channel=latest/stable
          export LXD_DIR=/var/snap/lxd/common/lxd
          sg lxd -c "lxc list"
          sg lxd -c "export LXD_DIR=/var/snap/lxd/common/lxd && spread vcr"
