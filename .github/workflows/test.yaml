name: Test

on:
  push:
    branches-ignore:
      - main
  pull_request:

jobs:
  verify:
    name: Build Verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup LXD
        run: |
          sudo snap install lxd --channel=5.21/stable
          sudo lxd init --auto
          sudo lxd waitready --timeout=60
          sudo adduser "$USER" lxd

      - name: Run spread tests
        run: |
          sudo snap install spread 
          sudo snap connect spread:lxd lxd:lxd 2>/dev/null || true
          sudo snap install snapcraft --classic --channel=latest/stable
          sg lxd -c "spread vcr"
