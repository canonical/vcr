summary: Verify that the VCR snap builds and contains expected binaries

execute: |
  echo "=== Building VCR snap ==="
  cd ../../
  snapcraft pack --use-lxd

  SNAP_FILE=$(ls video-course-recorder_*.snap 2>/dev/null | head -1)
  if [ -z "$SNAP_FILE" ]; then
    echo "FATAL: snap file not found after build"
    exit 1
  fi
  echo "Built: $SNAP_FILE ($(du -h "$SNAP_FILE" | cut -f1))"

  echo ""
  echo "=== Verifying snap contents ==="

  check() {
    local pattern="$1" label="$2"
    if unsquashfs -l "$SNAP_FILE" 2>/dev/null | grep -q "$pattern"; then
      echo "  PASS: $label"
    else
      echo "  FAIL: $label (pattern '$pattern' not found)"
      exit 1
    fi
  }

  check "bin/vcr"             "CLI entry point"
  check "bin/slidev"          "slidev wrapper"
  check "bin/vhs"             "VHS terminal recorder"
  check "bin/ffmpeg"          "FFmpeg"
  check "bin/piper"           "Piper TTS"
  check "bin/node"            "Node.js runtime"
  check "playwright-browsers" "Playwright + Chromium browsers"
  # Vite cache redirect: Slidev's cacheDir is patched to use VCR_VITE_CACHE
  # (per-user env var) instead of a read-only squashfs path or an external symlink.
  SLIDEV_MJS=$(unsquashfs -l "$SNAP_FILE" 2>/dev/null | grep -oE 'lib/node_modules/@slidev/cli/dist/serve-[^/]+\.mjs' | head -1)
  if [ -n "$SLIDEV_MJS" ] && unsquashfs -cat "$SNAP_FILE" "$SLIDEV_MJS" 2>/dev/null | grep -q 'VCR_VITE_CACHE'; then
    echo "  PASS: Vite cache redirect (VCR_VITE_CACHE)"
  else
    echo "  FAIL: Vite cache redirect (VCR_VITE_CACHE not found in Slidev dist)"
    exit 1
  fi


  echo ""
  echo "=== All checks passed ==="
