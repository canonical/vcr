name: video-course-recorder
title: Video Course Recorder
base: core24
version: '0.1.0'
summary: Training as Code — build courses from markdown slides
description: |
  VCR is a tool to implement "Training as Code". Each part of a course is
  expressed as code (markdown + scripts). Courses can be updated with a git
  patch, without re-recording videos, terminal sessions, or web demos.

  Features:
  - Terminal recordings via VHS (render-terminal)
  - Browser recordings via Playwright (render-playwright)
  - Speech synthesis via Piper (local) or ElevenLabs (cloud) (render-audio)
  - Timed MP4 video generation (record-video)
  - SCORM 1.2 packages for LMS delivery (build-scorm)
  - Static site generation for live presenting (build-slides)

grade: stable
confinement: strict
license: Apache-2.0
contact: https://github.com/canonical/vcr/issues
issues: https://github.com/canonical/vcr/issues
source-code: https://github.com/canonical/vcr
website: https://github.com/canonical/vcr

apps:
  video-course-recorder:
    command: bin/vcr
    aliases:
      - vcr
    plugs:
      - home
      - network
      - network-bind
      - browser-support
      - desktop
      - desktop-legacy
      - opengl
    environment:
      PLAYWRIGHT_BROWSERS_PATH: $SNAP/playwright-browsers
      FONTCONFIG_PATH: $SNAP/etc/fonts
      # espeak-ng (piper TTS) looks for phoneme tables at a compiled-in
      # /usr/share/espeak-ng-data which the core24 base does not ship.
      ESPEAK_DATA_PATH: $SNAP/usr/share/espeak-ng-data
      # Per-user writable vite dep cache (shared /tmp would collide across users)
      VCR_VITE_CACHE: $SNAP_USER_COMMON/vite-cache
      # Chromium crashpad needs a writable config/cache dir (GH runner bug:
      # "chrome_crashpad_handler: --database is required").
      XDG_CONFIG_HOME: $SNAP_USER_COMMON/config
      XDG_CACHE_HOME: $SNAP_USER_COMMON/cache
      PATH: $SNAP/bin:$SNAP/usr/bin:$PATH
      # Add both Ubuntu path and Debian alternative path for libraries.
      # Needed for ffmpeg to find the correct codec library
      LD_LIBRARY_PATH: $SNAP/lib:$SNAP/usr/lib:$SNAP/usr/lib/x86_64-linux-gnu:$SNAP/usr/lib/x86_64-linux-gnu/pulseaudio:$SNAP/usr/lib/x86_64-linux-gnu/blas:$SNAP/usr/lib/x86_64-linux-gnu/lapack:$LD_LIBRARY_PATH

parts:
  vcr-source:
    plugin: npm
    source: .
    npm-include-node: true
    npm-node-version: '24'
    stage-snaps:
      - piper-tts/edge
    stage-packages:
      - ffmpeg
      - libzstd1
      - libblas3
      - liblapack3
      # Runtime libs for the bundled Chromium (used by Playwright and by
      # VHS->go-rod). 
      - libnss3
      - libnspr4
      - libatk1.0-0t64
      - libatk-bridge2.0-0t64
      - libatspi2.0-0t64
      - libcups2t64
      - libdrm2
      - libdbus-1-3
      - libxkbcommon0
      - libxcomposite1
      - libxdamage1
      - libxfixes3
      - libxrandr2
      - libgbm1
      - libpango-1.0-0
      - libcairo2
      - libasound2t64
    override-build: |
      craftctl default
      # Remove any stale libzstd bundled by the piper-tts stage-snap so
      # the archive libzstd1 (1.5.x) staged above is the only one bundled.
      for d in "${CRAFT_PART_INSTALL}"/usr/lib/*/; do
        rm -f "${d}"libzstd.so.1.3.* "${d}"libzstd.so.1.4.*
      done
      # Install slidev globally so 'slidev' is on $SNAP/bin
      npm install -g @slidev/cli@53.0.0 --prefix "${CRAFT_PART_INSTALL}"
      npm install -g @slidev/theme-default@0.25.0 --prefix "${CRAFT_PART_INSTALL}"
      npm install -g @slidev/theme-seriph@0.25.0 --prefix "${CRAFT_PART_INSTALL}"
      # ESM imports from $SNAP/scripts (e.g. `import { chromium } from "playwright"`)
      # resolve node_modules by walking up from the script dir; the ESM loader
      # ignores NODE_PATH. npm --prefix installs into lib/node_modules, so expose
      # it at the snap root as node_modules so the scripts can import it.
      ln -sfn lib/node_modules "${CRAFT_PART_INSTALL}/node_modules"
      # Vite writes its dep cache to node_modules/.vite. When Slidev is
      # installed globally (as in this snap), it hardcodes cacheDir to
      # <cliRoot>/node_modules/.vite — read-only squashfs at runtime. Patch
      # that to a writable per-user dir instead of shipping an external symlink
      # (which the Snap Store rejects as lint-snap-v2_external_symlinks).
      find "${CRAFT_PART_INSTALL}/lib/node_modules/@slidev/cli/dist" -name '*.mjs' -print0 \
        | xargs -0 sed -i 's|join(options\.cliRoot, "node_modules/\.vite")|process.env.VCR_VITE_CACHE|g'
      grep -Rq 'VCR_VITE_CACHE' "${CRAFT_PART_INSTALL}/lib/node_modules/@slidev/cli/dist" \
        || { echo "ERROR: failed to patch Slidev cacheDir" >&2; exit 1; }
      # Slidev's edit shortcut assumes an external editor is available inside
      # the snap. Remove it rather than advertising a shortcut that may fail
      # under confinement or when the user's editor is not in the snap PATH.
      SLIDEV_CLI="${CRAFT_PART_INSTALL}/lib/node_modules/@slidev/cli/dist/cli.mjs"
      python3 - "${SLIDEV_CLI}" <<'PYTHON'
      from pathlib import Path
      import sys
      p = Path(sys.argv[1])
      s = p.read_text()
      editor_action = (
          '\t\t{\n'
          '\t\t\tname: "e",\n'
          '\t\t\tfullname: "edit",\n'
          '\t\t\taction() {\n'
          '\t\t\t\tconst editor = process.env.EDITOR || "code";\n'
          '\t\t\t\texecFile(editor, [entry]);\n'
          '\t\t\t}\n'
          '\t\t},\n'
      )
      if s.count(editor_action) != 1:
          raise SystemExit("ERROR: expected exactly one upstream Slidev edit shortcut; refusing to patch")
      s = s.replace(editor_action, "")
      banner_edit = '${underline("e")}${dim("dit | ")}'
      if s.count(banner_edit) != 1:
          raise SystemExit("ERROR: expected exactly one Slidev edit banner entry; refusing to patch")
      s = s.replace(banner_edit, "")
      import_line = 'import { execFile } from "node:child_process";\n'
      if s.count(import_line) != 1:
          raise SystemExit("ERROR: unexpected Slidev child_process import; refusing to patch")
      s = s.replace(import_line, "")
      if 'fullname: "edit"' in s or banner_edit in s or "execFile(editor" in s:
          raise SystemExit("ERROR: edit shortcut remains after patch")
      open_call = "await openBrowser(url);"
      if s.count(open_call) != 1:
          raise SystemExit("ERROR: expected exactly one Slidev browser-open call; refusing to patch")
      s = s.replace(open_call, 'await openBrowser(url, { app: { name: "xdg-open" }, wait: true });')
      if 'await openBrowser(url, { app: { name: "xdg-open" }, wait: true });' not in s:
          raise SystemExit("ERROR: failed to route browser open through Snap host integration")
      p.write_text(s)
      PYTHON
      grep -Fq 'fullname: "open"' "${SLIDEV_CLI}" \
        || { echo "ERROR: Slidev open shortcut missing after edit removal" >&2; exit 1; }
      grep -Fq 'shortcuts "' "${SLIDEV_CLI}" \
        || { echo "ERROR: Slidev shortcuts banner missing after edit removal" >&2; exit 1; }
      node --check "${SLIDEV_CLI}"
      # Wrap slidev to ensure the per-user VCR_VITE_CACHE dir exists at runtime
      mv "${CRAFT_PART_INSTALL}/bin/slidev" "${CRAFT_PART_INSTALL}/bin/slidev.real"
      cat > "${CRAFT_PART_INSTALL}/bin/slidev" << 'WRAPPER'
      #!/bin/sh
      mkdir -p "${VCR_VITE_CACHE:-$SNAP_USER_COMMON/vite-cache}"
      exec "${SNAP}/bin/slidev.real" "$@"
      WRAPPER
      chmod +x "${CRAFT_PART_INSTALL}/bin/slidev"
      # Organize scripts from slidev/src/ to top level
      mkdir -p "${CRAFT_PART_INSTALL}/scripts"
      cp -r "${CRAFT_PART_BUILD}/slidev/src/scripts/"* "${CRAFT_PART_INSTALL}/scripts/"
      mkdir -p "${CRAFT_PART_INSTALL}/components"
      cp -r "${CRAFT_PART_BUILD}/slidev/src/components/"* "${CRAFT_PART_INSTALL}/components/" 2>/dev/null || true
      mkdir -p "${CRAFT_PART_INSTALL}/styles"
      cp -r "${CRAFT_PART_BUILD}/slidev/src/styles/"* "${CRAFT_PART_INSTALL}/styles/" 2>/dev/null || true
      mkdir -p "${CRAFT_PART_INSTALL}/snippets"
      cp -r "${CRAFT_PART_BUILD}/slidev/src/snippets/"* "${CRAFT_PART_INSTALL}/snippets/" 2>/dev/null || true
      mkdir -p "${CRAFT_PART_INSTALL}/setup"
      cp -r "${CRAFT_PART_BUILD}/slidev/src/setup/"* "${CRAFT_PART_INSTALL}/setup/" 2>/dev/null || true
      # Ensure bin/vcr lands in the right place
      mkdir -p "${CRAFT_PART_INSTALL}/bin"
      cp "${CRAFT_PART_BUILD}/bin/vcr.js" "${CRAFT_PART_INSTALL}/bin/vcr"
      chmod +x "${CRAFT_PART_INSTALL}/bin/vcr"
      # Register the staged fonts with fontconfig. Under confinement the
      # default /usr/share/fonts resolves to the core24 base (which only ships
      # Plymouth.ttf); the DejaVu fonts are staged under $SNAP/usr/share/fonts.
      # /snap/video-course-recorder/current is a stable symlink to the active rev.
      mkdir -p "${CRAFT_PART_INSTALL}/etc/fonts/conf.d"
      cat > "${CRAFT_PART_INSTALL}/etc/fonts/conf.d/00-snap-fonts.conf" <<'FONTSCONF'
      <?xml version="1.0"?>
      <!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
      <fontconfig>
        <dir>/snap/video-course-recorder/current/usr/share/fonts</dir>
        <cachedir>/tmp/vcr-fontconfig</cachedir>
      </fontconfig>
      FONTSCONF

    override-stage: |
      craftctl default
      for d in "${CRAFT_STAGE}"/usr/lib/*/; do
        [ -e "${d}blas/libblas.so.3" ] && ln -sf "blas/libblas.so.3" "${d}libblas.so.3"
        [ -e "${d}lapack/liblapack.so.3" ] && ln -sf "lapack/liblapack.so.3" "${d}liblapack.so.3"
      done
      # Remove any stale libzstd bundled by the piper-tts stage-snap so
      # the archive libzstd1 (1.5.x) staged above is the only one bundled.
      for d in "${CRAFT_STAGE}"/usr/lib/*/; do
        rm -f "${d}"libzstd.so.1.3.* "${d}"libzstd.so.1.4.* 2>/dev/null || true
        for good in "${d}"libzstd.so.1.5*; do
          [ -e "${good}" ] || continue
          ln -sf "$(basename "${good}")" "${d}libzstd.so.1"
        done
      done

  vhs:
    plugin: go
    source: https://github.com/charmbracelet/vhs
    source-type: git
    source-tag: v0.9.0
    build-snaps:
      - go/latest/stable
    build-environment:
      - CGO_ENABLED: "0"
    stage-packages:
      - ttyd
    organize:
      bin/vhs: bin/vhs

  playwright-browsers:
    plugin: nil
    after: [vcr-source]
    build-packages:
      - libnss3
      - libnspr4
      - libatk1.0-0t64
      - libatk-bridge2.0-0t64
      - libcups2t64
      - libdrm2
      - libdbus-1-3
      - libxkbcommon0
      - libxcomposite1
      - libxdamage1
      - libxfixes3
      - libxrandr2
      - libgbm1
      - libpango-1.0-0
      - libcairo2
      - libasound2t64
    override-build: |
      set -eu
      PLAYWRIGHT_VERSION="1.64.0"
      BROWSERS_DIR="${CRAFT_PART_INSTALL}/playwright-browsers"

      "${CRAFT_STAGE}/bin/npm" install \
        "playwright@${PLAYWRIGHT_VERSION}" \
        "playwright-chromium@${PLAYWRIGHT_VERSION}" \
        --prefix "${CRAFT_PART_BUILD}"
      PLAYWRIGHT_BROWSERS_PATH="${BROWSERS_DIR}" \
        "${CRAFT_PART_BUILD}/node_modules/.bin/playwright" install chromium

      mkdir -p "${CRAFT_PART_INSTALL}/lib/node_modules"
      cp -r "${CRAFT_PART_BUILD}/node_modules/playwright" \
        "${CRAFT_PART_INSTALL}/lib/node_modules/"
      # playwright re-exports playwright-core; npm installs it as a dependency
      # in the same node_modules, so stage it too or the ESM `import "playwright"`
      # chain fails to resolve playwright-core at runtime.
      cp -r "${CRAFT_PART_BUILD}/node_modules/playwright-core" \
        "${CRAFT_PART_INSTALL}/lib/node_modules/"
      # Slidev's `slidev export` does a hard `import("playwright-chromium")`,
      # which is a separate package from `playwright`. Stage it too (it
      # re-exports playwright-core and reuses the same bundled browsers).
      cp -r "${CRAFT_PART_BUILD}/node_modules/playwright-chromium" \
        "${CRAFT_PART_INSTALL}/lib/node_modules/"

      CHROME_BIN=$(ls "${BROWSERS_DIR}"/chromium-*/chrome-linux64/chrome 2>/dev/null | head -1)
      if [ -z "${CHROME_BIN}" ]; then
        echo "ERROR: bundled chromium not found under ${BROWSERS_DIR}" >&2
        exit 1
      fi
      mkdir -p "${CRAFT_PART_INSTALL}/usr/bin"
      REL=$(realpath --relative-to="${CRAFT_PART_INSTALL}/usr/bin" "${CHROME_BIN}")
      ln -sf "${REL}" "${CRAFT_PART_INSTALL}/usr/bin/chromium.real"
      # Wrapper: VHS->go-rod launches this chromium. In CI (and any root
      # context) chromium refuses to start without --no-sandbox
      # (crbug.com/638180). Rendering is fully local/in-snap (no untrusted
      # web content), so disabling the sandbox here is safe. Inject the flag
      # unconditionally so terminal recording works for both root and users.
      printf '%s\n' \
        '#!/bin/sh' \
        'exec "$(dirname "$(readlink -f "$0")")/chromium.real" --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-crash-reporter "$@"' \
        > "${CRAFT_PART_INSTALL}/usr/bin/chromium"
      chmod +x "${CRAFT_PART_INSTALL}/usr/bin/chromium"
    prime:
      - playwright-browsers/
      - lib/node_modules/playwright/
      - lib/node_modules/playwright-core/
      - lib/node_modules/playwright-chromium/
      - usr/bin/chromium
      - usr/bin/chromium.real
